# Cấu hình mẫu — chỉnh theo format feed thực tế của Sở.

[capture]
timezone_offset_hours = 7          # múi giờ hiển thị / tách ngày (VN = +7)
protocol = "udp"                   # udp | tcp | any
dst_ip = []                        # vd ["233.57.10.1"] (multicast feed); rỗng = tất cả
dst_port = []

[decoder]
mode = "regex"                     # regex | fixed
# Ví dụ giả định: payload có đoạn "|T=M1|" ; sửa theo format thật.
# FIX-like: pattern = '35=(?P<type>[A-Za-z0-9]+)\x01'
pattern = 'T=(?P<type>[A-Z0-9]+)\|(?:S=(?P<sub>[A-Z0-9]+)\|)?(?:TS=(?P<ts>\d+)\|)?'
key = "{type}"                     # có thể "{type}:{sub}" để tách K04:AD2 / K04:AA1 ...
# mode = "fixed": type_offset = 4, type_length = 2, ts_offset = 10, ts_length = 9

[latency]
mode = "clock"                     # clock | exchange_ts | first_packet
reference_clock = "09:00:00"       # mốc tham chiếu khi mode = clock
exchange_ts_format = "%H%M%S%f"    # khi mode = exchange_ts (giờ trong message, cùng múi giờ)

[report]
columns   = ["M1", "MM", "K08", "K04:AD2", "K04:AA1", "K04:AB1", "D"]
highlight = ["M1", "MM", "K08", "D"]   # nhóm xét "tới sớm nhất" (tô xanh)
race_day_note = "No race day"

[report.labels]
"K04:AD2" = "First K04 (AD2)"
"K04:AA1" = "First K04 (AA1)"
"K04:AB1" = "First K04 (AB1)"

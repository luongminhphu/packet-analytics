[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-analytics"
version = "0.1.0"
description = "Đọc pcap/pcapng, giải mã message type và đo first-arrival latency đầu ngày giao dịch"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
live = ["scapy>=2.5"]   # capture realtime trên Windows (cần Npcap) hoặc dùng BPF filter
all = ["openpyxl>=3.1", "scapy>=2.5"]

[project.scripts]
packet-analytics = "packet_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
